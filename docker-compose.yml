name: kestrel-control-tower

# Requires ASSIGNMENT_PACK_DIR pointing at the unzipped FDE assignment pack
# (the folder containing data/kestrel_ops.db, bazaarpulse_site/,
# partner_api/). Copy .env.example to .env and set it there. None of that
# data is committed to this repo -- see README and DECISIONS.md.
#
# ASSIGNMENT_PACK_DIR is used two different ways below, on purpose:
#   - data/ (95MB DB + CSVs) is read live by the etl container via a
#     runtime bind mount -- it's too large to bake into an image sensibly.
#   - bazaarpulse_site/ and partner_api/ are small, static fixtures baked
#     into their images at BUILD time via `additional_contexts`, not
#     mounted at runtime. Build-context transfer is a one-shot file read
#     by the Docker CLI, not a live bind mount, so it isn't subject to
#     Docker Desktop's File Sharing allow-list the way `volumes:` is --
#     this is what actually broke on first real Docker Desktop test (see
#     DECISIONS.md for the root cause and why this is the fix, not a
#     workaround).
#
# The `${ASSIGNMENT_PACK_DIR:?...}` syntax below means Compose refuses to
# start with a clear error if the variable is unset or empty, instead of
# silently substituting an empty string (which is exactly what produced
# the bogus `/partner_api` absolute-path mount in the original bug).

services:
  bazaarpulse:
    build:
      context: .
      dockerfile: docker/bazaarpulse.Dockerfile
      additional_contexts:
        site: "${ASSIGNMENT_PACK_DIR:?Set ASSIGNMENT_PACK_DIR in .env to your unzipped assignment pack path -- see README}/bazaarpulse_site"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/index.html')"]
      interval: 3s
      timeout: 3s
      retries: 20

  partner-api:
    build:
      context: .
      dockerfile: docker/partner-api.Dockerfile
      additional_contexts:
        pack: "${ASSIGNMENT_PACK_DIR:?Set ASSIGNMENT_PACK_DIR in .env to your unzipped assignment pack path -- see README}/partner_api"
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/v1/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    depends_on:
      bazaarpulse:
        condition: service_healthy
      partner-api:
        condition: service_healthy
    volumes:
      - "${ASSIGNMENT_PACK_DIR:?Set ASSIGNMENT_PACK_DIR in .env to your unzipped assignment pack path -- see README}/data:/data:ro"
      - warehouse_data:/app/warehouse
      - cache_data:/app/cache
    environment:
      KESTREL_DB_PATH: /data/kestrel_ops.db
      BAZAARPULSE_BASE_URL: http://bazaarpulse:8080
      PARTNER_API_BASE_URL: http://partner-api:8088
      WAREHOUSE_DB_PATH: /app/warehouse/warehouse.duckdb
      CACHE_DIR: /app/cache
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      etl:
        condition: service_completed_successfully
    volumes:
      - warehouse_data:/app/warehouse:ro
    environment:
      WAREHOUSE_DB_PATH: /app/warehouse/warehouse.duckdb
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    healthcheck:
      # Checks the JSON body's status field, not just HTTP 200 -- /health
      # returns 200 with status="degraded" for a warehouse that failed (or
      # never ran) etl/validate_warehouse.py's data-quality gate (see
      # backend/app/routers/health.py), and a bare HTTP-success check would
      # have missed that, letting the container report healthy while
      # serving a warehouse the gate rejected.
      test: ["CMD", "python3", "-c", "import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8000/health')); sys.exit(0 if d.get('status')=='ok' else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  warehouse_data:
  cache_data:
